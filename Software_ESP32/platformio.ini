[platformio]
default_envs = esp32c3, nano
src_dir = src
include_dir = include

[env]
framework = arduino

[env:esp32c3]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
board_build.partitions = partitions_ota.csv
# Use the ESP32-C3 native USB Serial/JTAG reset sequence to enter download mode
# without manually holding BOOT during upload.
board_upload.before_reset = usb_reset
# ESP32-C3 SuperMini uses native USB Serial/JTAG. A watchdog reset performs
# a full reset after flashing so the chip leaves ROM download mode reliably.
board_upload.after_reset = watchdog_reset
# esptool 4.9 adds watchdog_reset support; espressif32 6.10 bundles an older version.
platform_packages = platformio/tool-esptoolpy@2.40900.250804
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
build_src_filter = +<ESP32/*.cpp>

[env:esp32c3_ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = ${sysenv.ESP32_OTA_HOST}
upload_flags = --auth=${sysenv.ESP32_OTA_PASSWORD}

[env:nano]
platform = atmelavr@^5.1.0
board = nanoatmega328new
monitor_speed = 115200
lib_extra_dirs = ../Software/lib
build_src_filter = +<Arduino/*.cpp>

; Some Nano clones still use the original 57600-baud bootloader.
[env:nano_oldbootloader]
extends = env:nano
board = nanoatmega328
